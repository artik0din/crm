services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/postgres-docker-entrypoint.sh"]
    environment:
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: postgres
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/selfhost-guard-env.sh:/usr/local/bin/selfhost-guard-env.sh:ro
      - ./deploy/postgres-docker-entrypoint.sh:/usr/local/bin/postgres-docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - crm

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/redis-docker-cmd.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - ./deploy/selfhost-guard-env.sh:/usr/local/bin/selfhost-guard-env.sh:ro
      - ./deploy/redis-docker-cmd.sh:/usr/local/bin/redis-docker-cmd.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - crm

  migrate:
    image: crm-migrate:selfhost
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrator
    restart: "no"
    working_dir: /app/packages/db
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "sh",
        "-c",
        "/usr/local/bin/selfhost-guard-env.sh && bun run db:deploy",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm

  api:
    image: crm-api:selfhost
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_URL: http://agent:2000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PORT: 3001
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
    ports:
      - 127.0.0.1:${API_PORT:-5801}:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - crm

  app:
    image: crm-app:selfhost
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_URL: http://agent:2000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PORT: 3000
    ports:
      - 127.0.0.1:${APP_PORT:-5800}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - crm

  tools:
    image: crm-migrate:selfhost
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrator
    restart: "no"
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - ./import:/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm

  agent:
    image: crm-agent:selfhost
    profiles: ["agent"]
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_PORT: 2000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    volumes:
      - agent-eve-workflow:/app/apps/agent/.eve/.workflow-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - crm

volumes:
  postgres-data:
  agent-eve-workflow:

networks:
  crm:
    name: crm-selfhost
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.16.47.0/24}
